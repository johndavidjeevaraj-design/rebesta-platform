name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push cancels the previous run instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # NestJS backend
  # ------------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rebesta_backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rebesta_backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Jest setup
        run: |
          echo "=== Jest setup file ==="
          test -f src/jest.setup.ts
          echo "src/jest.setup.ts exists."

          echo ""
          echo "=== Jest setup file size ==="
          wc -l src/jest.setup.ts

          echo ""
          echo "=== Jest configuration ==="
          npx jest --showConfig > jest-config-ci.json
          grep -A 4 '"setupFiles"' jest-config-ci.json
          grep '"rootDir"' jest-config-ci.json | head -n 1

          echo ""
          echo "=== Expected Jest setup path ==="
          grep -F '"'"$(pwd)"'/src/jest.setup.ts"' jest-config-ci.json \
            && echo "Jest setup path is correct." \
            || {
              echo "::error::Jest is NOT resolving src/jest.setup.ts"
              exit 1
            }

      - name: Build
        run: npm run build

      # Never use real Supabase credentials in CI.
      # jest.setup.ts mocks @supabase/supabase-js before application imports.
      - name: Test
        env:
          SUPABASE_URL: http://supabase.test
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
        run: |
          echo "=== Running backend tests ==="
          npm test -- --runInBand

      - name: Lint
        run: npm run lint
        continue-on-error: true

  # ------------------------------------------------------------------
  # Flutter apps - one job per app, run in parallel
  # ------------------------------------------------------------------
  flutter:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: rebesta_customers
            flutter-version: '3.47.4'

          - app: rebesta_delivery
            flutter-version: '3.47.4'

          - app: rebesta_partner
            flutter-version: '3.47.4'

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Test
        run: flutter test

  # ------------------------------------------------------------------
  # Guard: a service-account key must never be committed again
  # ------------------------------------------------------------------
  secrets:
    name: No credentials committed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for Firebase / service-account keys
        run: |
          if git log --all --pretty=format: --name-only --diff-filter=A \
            | sort -u \
            | grep -Ei 'adminsdk.*\.json$|google-services\.json$|\.p8$|\.p12$|^\.env$|serviceAccount.*\.json$'; then

            echo "::error::A credential file exists somewhere in this repository's history."
            exit 1
          fi

          echo "No credential files in history."
