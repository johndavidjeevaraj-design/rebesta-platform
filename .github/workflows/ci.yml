name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push cancels the previous run instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # NestJS backend
  # ------------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rebesta_backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rebesta_backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # --------------------------------------------------------------
      # Verify Jest is actually loading the bootstrap file.
      # This is intentionally done before the test command.
      # --------------------------------------------------------------
      - name: Verify Jest setup
        run: |
          echo "=== Jest setup file ==="

          test -f jest.setup.js

          echo "jest.setup.js exists."

          echo ""
          echo "=== Jest setup file size ==="

          wc -l jest.setup.js

          echo ""
          echo "=== Jest configuration ==="

          npx jest --showConfig > jest-config-ci.json

          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const config = JSON.parse(
            fs.readFileSync('jest-config-ci.json', 'utf8')
          );

          console.log('rootDir:', config.rootDir);
          console.log('setupFiles:', config.setupFiles);

          if (!Array.isArray(config.setupFiles) || config.setupFiles.length === 0) {
            console.error('::error::Jest has no setupFiles configured.');
            process.exit(1);
          }

          const expected = path.resolve('jest.setup.js');
          const actual = path.resolve(config.setupFiles[0]);

          console.log('');
          console.log('Expected setup file:', expected);
          console.log('Actual setup file:', actual);

          if (actual !== expected) {
            console.error('::error::Jest is NOT resolving jest.setup.js');
            process.exit(1);
          }

          console.log('');
          console.log('Jest setup path is correct.');
          NODE

      - name: Build
        run: npm run build

      # Never use real Supabase credentials in CI.
      # These values are only fallbacks. jest.setup.js also sets them.
      - name: Test
        env:
          SUPABASE_URL: http://supabase.test
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
        run: |
          echo "=== Running backend tests ==="
          npm test -- --runInBand

      - name: Lint
        run: npm run lint
        continue-on-error: true

  # ------------------------------------------------------------------
  # Flutter apps - one job per app, run in parallel
  # ------------------------------------------------------------------
  flutter:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: rebesta_customers
            flutter-version: '3.47.4'

          - app: rebesta_delivery
            flutter-version: '3.47.4'

          - app: rebesta_partner
            flutter-version: '3.47.4'

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Test
        run: flutter test

  # ------------------------------------------------------------------
  # Guard: credential files must never be committed
  # ------------------------------------------------------------------
  secrets:
    name: No credentials committed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for Firebase / service-account keys
        run: |
          if git log --all --pretty=format: --name-only --diff-filter=A \
            | sort -u \
            | grep -Ei 'adminsdk.*\.json$|google-services\.json$|\.p8$|\.p12$|^\.env$|serviceAccount.*\.json$'; then

            echo "::error::A credential file exists somewhere in this repository's history."
            exit 1
          fi

          echo "No credential files in history."